<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>測試頁</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --err: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: rgba(34, 197, 94, 0.15);
      color: var(--ok);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--accent);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      word-break: break-all;
    }
    td:first-child {
      width: 170px;
      color: var(--muted);
    }
    tr:last-child td {
      border-bottom: none;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    input {
      flex: 1;
      min-width: 220px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
    }
    button {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0284c7;
      color: #fff;
      font-size: 0.92rem;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
    }
    button:hover { opacity: 0.92; }
    pre {
      margin: 12px 0 0;
      padding: 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>測試頁</h1>
      <span class="badge" id="netStatus">線上 / 頁面已載入</span>
    </div>

    <div class="card">
      <h2>目前頁面與連線資訊</h2>
      <table>
        <tr><td>目前網址 (URL)</td><td id="curUrl"></td></tr>
        <tr><td>來源主機 (Host)</td><td id="curHost"></td></tr>
        <tr><td>協定 (Protocol)</td><td id="curProto"></td></tr>
        <tr><td>客戶端時間</td><td id="curTime"></td></tr>
        <tr><td>瀏覽器語系</td><td id="curLang"></td></tr>
        <tr><td>User-Agent</td><td id="curUA"></td></tr>
      </table>
      <div class="controls">
        <button class="secondary" onclick="copyReport()">複製診斷資訊</button>
        <span id="copyMsg" style="align-self:center; font-size:0.88rem; color:var(--muted);"></span>
      </div>
    </div>

    <div class="card">
      <h2>端點連線測試 (Fetch)</h2>
      <p style="margin:0 0 10px; color:var(--muted); font-size:0.9rem;">
        可測試同網域路徑（如 <code>/health</code> 或 <code>./index.html</code>）或指定 URL，檢查狀態碼與回應時間。
      </p>
      <div class="controls">
        <input id="targetUrl" type="text" value="./index.html" placeholder="輸入測試網址，例如 /api/health 或 ./index.html" />
        <button onclick="runFetchTest()">發送測試</button>
      </div>
      <pre id="testResult">尚未執行測試。</pre>
    </div>
  </div>

  <script>
    function updateClock() {
      document.getElementById("curTime").textContent = new Date().toLocaleString("zh-TW", { hour12: false });
    }

    function initInfo() {
      document.getElementById("curUrl").textContent = window.location.href;
      document.getElementById("curHost").textContent = window.location.host || "(本機檔案 / 無 Host)";
      document.getElementById("curProto").textContent = window.location.protocol;
      document.getElementById("curLang").textContent = navigator.language || "-";
      document.getElementById("curUA").textContent = navigator.userAgent || "-";
      updateClock();
      setInterval(updateClock, 1000);

      const updateOnline = () => {
        const el = document.getElementById("netStatus");
        if (navigator.onLine) {
          el.textContent = "線上 / 頁面已載入";
          el.style.color = "";
        } else {
          el.textContent = "離線狀態";
          el.style.color = "#ef4444";
        }
      };
      window.addEventListener("online", updateOnline);
      window.addEventListener("offline", updateOnline);
      updateOnline();
    }

    async function runFetchTest() {
      const url = document.getElementById("targetUrl").value.trim();
      const out = document.getElementById("testResult");
      if (!url) {
        out.innerHTML = '<span class="err">請先輸入要測試的網址。</span>';
        return;
      }
      out.textContent = `測試中：${url} ...`;
      const start = performance.now();
      try {
        const res = await fetch(url, { cache: "no-store" });
        const elapsed = (performance.now() - start).toFixed(1);
        const text = await res.text();
        const preview = text.slice(0, 300).replace(/</g, "&lt;");
        out.innerHTML =
          `狀態：<span class="${res.ok ? "ok" : "err"}">${res.status} ${res.statusText}</span> | 耗時：${elapsed} ms\n` +
          `內容長度：${text.length} 字元\n` +
          `片段預覽：\n${preview}`;
      } catch (err) {
        const elapsed = (performance.now() - start).toFixed(1);
        out.innerHTML = `<span class="err">請求失敗（${elapsed} ms）：${err.message}</span>\n可能原因：網址無效、CORS 限制、逾時或遭網路/代理阻擋。`;
      }
    }

    async function copyReport() {
      const msg = document.getElementById("copyMsg");
      const report = [
        `URL: ${window.location.href}`,
        `Host: ${window.location.host}`,
        `Time: ${new Date().toISOString()}`,
        `User-Agent: ${navigator.userAgent}`
      ].join("\n");
      try {
        await navigator.clipboard.writeText(report);
        msg.textContent = "已複製到剪貼簿";
      } catch {
        msg.textContent = "無法自動複製，請手動選取複製";
      }
    }

    initInfo();
  </script>
</body>
</html>
